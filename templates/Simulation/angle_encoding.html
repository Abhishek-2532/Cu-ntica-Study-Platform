<div class="angle-encoding-module">

    <style>

        .angle-encoding-module{
            font-family: Arial, Helvetica, sans-serif;
            background:#f4f6f9;
            padding:40px;
            margin:30px 0;
        }

        .angle-encoding-module .ae-container{
            max-width:750px;
            margin:auto;
            background:#fff;
            padding:30px;
            border-radius:10px;
            box-shadow:0 2px 10px rgba(0,0,0,.15);
        }

        .angle-encoding-module h1{
            text-align:center;
            color:#2c3e50;
            margin-top:0;
        }

        .angle-encoding-module p{
            color:#555;
            text-align:center;
            margin-bottom:30px;
            line-height:1.6;
        }

        .angle-encoding-module label{
            display:block;
            margin-top:15px;
            font-weight:bold;
        }

        .angle-encoding-module input{
            width:100%;
            padding:10px;
            margin-top:5px;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        .angle-encoding-module button{
            width:100%;
            margin-top:20px;
            padding:12px;
            border:none;
            border-radius:5px;
            background:#007bff;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        .angle-encoding-module button:hover{
            background:#0056b3;
        }

        .angle-encoding-module h3{
            margin-top:30px;
            color:#2c3e50;
        }

        .angle-encoding-module pre{
            background:#f0f0f0;
            padding:15px;
            border-radius:5px;
            overflow:auto;
            white-space:pre-wrap;
        }

        .angle-encoding-module img{
            width:100%;
            margin-top:15px;
            border:1px solid #ddd;
            border-radius:5px;
        }

    </style>

    <div class="ae-container">

        <h1>Angle Encoding Simulator</h1>

        <p>
            Enter numerical values separated by commas.
            Each value is encoded into a qubit using an RY rotation gate.
        </p>

        <label>Input Angles (Radians)</label>

        <input
            type="text"
            id="ae_angles"
            placeholder="Example: 0.5,1.2,2.4">

        <button onclick="angleEncodingSimulation()">
            Run Angle Encoding
        </button>

        <h3>Encoded Data</h3>

        <pre id="ae_output">
Waiting for simulation...
        </pre>

        <h3>Generated Quantum Circuit</h3>

        <img
            id="ae_circuit"
            alt="Quantum Circuit">

    </div>

</div>

<script>

function angleEncodingSimulation(){

    const angles = document
        .getElementById("ae_angles")
        .value
        .split(",")
        .map(x => parseFloat(x.trim()))
        .filter(x => !isNaN(x));

    fetch("/simulation/angle_encoding",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            data:angles
        })

    })

    .then(response=>response.json())

    .then(data=>{

        if(data.success){

            document.getElementById("ae_output").textContent =
                JSON.stringify(data,null,4);

            document.getElementById("ae_circuit").src =
                data.image + "?" + new Date().getTime();

        }else{

            alert(data.error);

        }

    })

    .catch(error=>{

        alert("Server Error : " + error);

    });

}

</script>
