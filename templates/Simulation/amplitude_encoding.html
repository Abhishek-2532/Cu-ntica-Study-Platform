<div class="amplitude-encoding-module">

<style>

.amplitude-encoding-module{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
    padding:40px;
    margin:30px 0;
}

.amplitude-encoding-module .container{
    max-width:750px;
    margin:auto;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.amplitude-encoding-module h1{
    text-align:center;
    color:#2c3e50;
}

.amplitude-encoding-module p{
    text-align:center;
    color:#555;
    margin-bottom:25px;
}

.amplitude-encoding-module label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

.amplitude-encoding-module input{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

.amplitude-encoding-module button{
    width:100%;
    margin-top:20px;
    padding:12px;
    border:none;
    border-radius:5px;
    background:#007bff;
    color:white;
    cursor:pointer;
    font-size:16px;
}

.amplitude-encoding-module button:hover{
    background:#0056b3;
}

.amplitude-encoding-module pre{
    background:#f0f0f0;
    padding:15px;
    border-radius:5px;
}

.amplitude-encoding-module img{
    width:100%;
    margin-top:20px;
    border:1px solid #ddd;
    border-radius:5px;
}

</style>

<div class="container">

<h1>Amplitude Encoding Simulator</h1>

<p>
Enter vector values separated by commas.
<br>
Example: 1,2,3,4
</p>

<label>Input Vector</label>

<input
type="text"
id="amp_vector"
placeholder="Example: 1,2,3,4">

<label>Simulation Shots</label>

<input
type="number"
id="amp_shots"
value="1024">

<button onclick="runAmplitudeEncoding()">
Run Amplitude Encoding
</button>

<h3>Measurement Counts</h3>

<pre id="amp_counts">
Waiting for simulation...
</pre>

<h3>Quantum Circuit</h3>

<img id="amp_circuit">

</div>

</div>

<script>

function runAmplitudeEncoding(){

    const vector=document.getElementById("amp_vector")
        .value
        .split(",")
        .map(x=>parseFloat(x.trim()))
        .filter(x=>!isNaN(x));

    fetch("/simulation/amplitude_encoding",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            data:vector,

            shots:parseInt(
                document.getElementById("amp_shots").value
            )

        })

    })

    .then(response=>response.json())

    .then(data=>{

        if(data.success){

            document.getElementById("amp_counts").textContent=
            JSON.stringify(data.counts,null,4);

            document.getElementById("amp_circuit").src=
            data.image+"?"+new Date().getTime();

        }

        else{

            alert(data.error);

        }

    })

    .catch(error=>{

        alert(error);

    });

}

</script>
