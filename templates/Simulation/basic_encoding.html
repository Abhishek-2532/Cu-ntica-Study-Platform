<div class="basis-encoding-module">

    <style>

        .basis-encoding-module{
            font-family: Arial, Helvetica, sans-serif;
            background:#f4f6f9;
            padding:40px;
            margin:30px 0;
        }

        .basis-encoding-module .be-container{
            max-width:750px;
            margin:auto;
            background:#fff;
            padding:30px;
            border-radius:10px;
            box-shadow:0 2px 10px rgba(0,0,0,.15);
        }

        .basis-encoding-module h1{
            text-align:center;
            color:#2c3e50;
            margin-top:0;
        }

        .basis-encoding-module p{
            color:#555;
            text-align:center;
            margin-bottom:30px;
            line-height:1.6;
        }

        .basis-encoding-module label{
            display:block;
            margin-top:15px;
            font-weight:bold;
        }

        .basis-encoding-module input{
            width:100%;
            padding:10px;
            margin-top:5px;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        .basis-encoding-module button{
            width:100%;
            margin-top:20px;
            padding:12px;
            border:none;
            border-radius:5px;
            background:#007bff;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        .basis-encoding-module button:hover{
            background:#0056b3;
        }

        .basis-encoding-module h3{
            margin-top:30px;
            color:#2c3e50;
        }

        .basis-encoding-module pre{
            background:#f0f0f0;
            padding:15px;
            border-radius:5px;
            overflow:auto;
            white-space:pre-wrap;
        }

        .basis-encoding-module img{
            width:100%;
            margin-top:15px;
            border:1px solid #ddd;
            border-radius:5px;
        }

    </style>

    <div class="be-container">

        <h1>Basis Encoding Simulator</h1>

        <p>
            Enter a binary string to encode it into a quantum computational basis state
            and simulate the resulting quantum circuit.
        </p>

        <label>Binary Input</label>

        <input
            type="text"
            id="be_binary"
            placeholder="Example: 1011">

        <label>Simulation Shots</label>

        <input
            type="number"
            id="be_shots"
            value="1024"
            min="1">

        <button onclick="basisEncodingSimulation()">
            Run Basis Encoding
        </button>

        <h3>Measurement Counts</h3>

        <pre id="be_counts">Waiting for simulation...</pre>

        <h3>Generated Quantum Circuit</h3>

        <img id="be_circuit" alt="Quantum Circuit">

    </div>

</div>

<script>

function basisEncodingSimulation(){

    fetch("/simulation/basis_encoding",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            binary:document.getElementById("be_binary").value.trim(),
            shots:parseInt(document.getElementById("be_shots").value)

        })

    })

    .then(response=>response.json())

    .then(data=>{

        if(data.success){

            document.getElementById("be_counts").textContent =
                JSON.stringify(data.counts,null,4);

            document.getElementById("be_circuit").src =
                data.image + "?" + new Date().getTime();

        }else{

            alert(data.error);

        }

    })

    .catch(error=>{

        alert("Server Error : " + error);

    });

}

</script>
