<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Python Code Runner</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#0f172a;
padding:40px;

}

.wrapper{

max-width:1100px;
margin:auto;

}

h1{

color:white;
margin-bottom:20px;

}

#editor{

height:450px;

border-radius:10px;

overflow:hidden;

border:1px solid #334155;

}

.actions{

margin:20px 0;

}

button{

background:#2563eb;

color:white;

border:none;

padding:12px 25px;

font-size:16px;

border-radius:8px;

cursor:pointer;

}

button:hover{

background:#1d4ed8;

}

.output{

margin-top:20px;

background:#111827;

border:1px solid #334155;

border-radius:10px;

padding:20px;

color:#22c55e;

font-family:monospace;

white-space:pre-wrap;

min-height:180px;

overflow:auto;

}

.error{

color:#ef4444;

}

img{

max-width:100%;

margin-top:15px;

}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>

</head>

<body>

<div class="wrapper">

<h1>Python Code Runner</h1>

<div id="editor"></div>

<div class="actions">

<button onclick="runCode()">

▶ Run Code

</button>

</div>

<div id="output" class="output">

Output will appear here...

</div>

</div>

<script>

let editor;

require.config({

paths:{

vs:"https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs"

}

});

require(["vs/editor/editor.main"],function(){

editor=monaco.editor.create(

document.getElementById("editor"),

{

value:

`print("Hello Cuántica")

for i in range(5):
    print(i)`,

language:"python",

theme:"vs-dark",

automaticLayout:true,

minimap:{
enabled:false
}

}

);

});

async function runCode(){

const output=document.getElementById("output");

output.innerHTML="Running...";

try{

const response=await fetch("/execute",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

code:editor.getValue()

})

});

const result=await response.json();

output.innerHTML="";

if(result.error){

output.innerHTML=

`<div class="error">${result.error}</div>`;

return;

}

if(result.outputs.length===0){

output.innerHTML="No Output";

return;

}

result.outputs.forEach(out=>{

if(out.type==="stream"){

output.innerHTML+=out.text+"<br>";

}

else if(out.type==="text"){

output.innerHTML+=out.data+"<br>";

}

else if(out.type==="html"){

output.innerHTML+=out.data;

}

else if(out.type==="image"){

output.innerHTML+=

`<img src="${out.data}">`;

}

else if(out.type==="svg"){

output.innerHTML+=out.data;

}

else if(out.type==="error"){

output.innerHTML+=

`<div class="error">${out.raw}</div>`;

}

});

}

catch(e){

output.innerHTML=

`<div class="error">${e}</div>`;

}

}

</script>

</body>
</html>
