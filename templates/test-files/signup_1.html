<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QML Learning - Sign Up</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;

}

.container{

width:100%;
max-width:750px;
background:#fff;
border-radius:15px;
padding:35px;
box-shadow:0 20px 40px rgba(0,0,0,.2);

}

.logo{

text-align:center;
font-size:30px;
font-weight:bold;
color:#2563eb;
margin-bottom:5px;

}

.subtitle{

text-align:center;
margin-bottom:30px;
color:#666;

}

.progress{

display:flex;
margin-bottom:25px;

}

.bar{

flex:1;
height:8px;
background:#ddd;
margin-right:10px;
border-radius:10px;

}

.bar:last-child{

margin-right:0;

}

.active{

background:#2563eb;

}

.step{

display:none;

}

.step.active{

display:block;

}

.grid{

display:grid;
grid-template-columns:1fr 1fr;
gap:15px;

}

.input-group{

margin-bottom:18px;

}

label{

display:block;
margin-bottom:6px;
font-size:14px;
font-weight:bold;

}

input,select,textarea{

width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;

}

textarea{

resize:none;
height:80px;

}

.buttons{

display:flex;
justify-content:space-between;
margin-top:20px;

}

button{

padding:12px 25px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;

}

.next{

background:#2563eb;
color:#fff;

}

.back{

background:#ddd;

}

.submit{

background:#16a34a;
color:#fff;

}

.message{

margin-top:20px;
font-weight:bold;
text-align:center;

}

@media(max-width:700px){

.grid{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<div class="container">

<div class="logo">
Quantum ML Academy
</div>

<div class="subtitle">
Create your student account
</div>

<div class="progress">

<div class="bar active" id="bar1"></div>
<div class="bar" id="bar2"></div>

</div>

<!-- STEP 1 -->

<div class="step active" id="step1">

<div class="input-group">
<label>Email Address</label>
<input type="email" id="email" required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="password" required>
</div>

<div class="buttons">

<div></div>

<button class="next" onclick="nextStep()">
Continue
</button>

</div>

</div>

<!-- STEP 2 -->

<div class="step" id="step2">

<div class="grid">

<div class="input-group">
<label>First Name</label>
<input type="text" id="first_name">
</div>

<div class="input-group">
<label>Last Name</label>
<input type="text" id="last_name">
</div>

<div class="input-group">
<label>Phone</label>
<input type="text" id="phone">
</div>

<div class="input-group">
<label>Gender</label>

<select id="gender">

<option>Male</option>
<option>Female</option>
<option>Other</option>

</select>

</div>

<div class="input-group">
<label>Date of Birth</label>
<input type="date" id="dob">
</div>

<div class="input-group">
<label>College</label>
<input type="text" id="college">
</div>

<div class="input-group">
<label>University</label>
<input type="text" id="university">
</div>

<div class="input-group">
<label>Course</label>
<input type="text" id="course">
</div>

<div class="input-group">
<label>Branch</label>
<input type="text" id="branch">
</div>

<div class="input-group">
<label>Semester</label>
<input type="text" id="semester">
</div>

<div class="input-group">
<label>Country</label>
<input type="text" id="country">
</div>

<div class="input-group">
<label>State</label>
<input type="text" id="state">
</div>

<div class="input-group">
<label>City</label>
<input type="text" id="city">
</div>

</div>

<div class="input-group">

<label>Bio</label>

<textarea id="bio"></textarea>

</div>

<div class="buttons">

<button class="back" onclick="backStep()">

Back

</button>

<button class="submit" onclick="registerUser()">

Create Account

</button>

</div>

</div>

<div id="message" class="message"></div>

</div>

<script>

function nextStep(){

const email=document.getElementById("email").value.trim();

const password=document.getElementById("password").value.trim();

if(email=="" || password==""){

alert("Please enter Email and Password");

return;

}

document.getElementById("step1").classList.remove("active");

document.getElementById("step2").classList.add("active");

document.getElementById("bar2").classList.add("active");

}

function backStep(){

document.getElementById("step2").classList.remove("active");

document.getElementById("step1").classList.add("active");

document.getElementById("bar2").classList.remove("active");

}

async function registerUser(){

const data={

email:document.getElementById("email").value,

password:document.getElementById("password").value,

first_name:document.getElementById("first_name").value,

last_name:document.getElementById("last_name").value,

full_name:

document.getElementById("first_name").value+" "+document.getElementById("last_name").value,

phone:document.getElementById("phone").value,

gender:document.getElementById("gender").value,

dob:document.getElementById("dob").value,

bio:document.getElementById("bio").value,

college:document.getElementById("college").value,

university:document.getElementById("university").value,

course:document.getElementById("course").value,

branch:document.getElementById("branch").value,

semester:document.getElementById("semester").value,

country:document.getElementById("country").value,

state:document.getElementById("state").value,

city:document.getElementById("city").value,

profile_image:"https://ui-avatars.com/api/?background=2563eb&color=fff&name=Student"

};

try{

const response=await fetch("/api/users/register",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify(data)

});

const result=await response.json();

document.getElementById("message").innerHTML=result.message;

if(result.success){

setTimeout(()=>{

window.location="/login";

},1200);

}

}catch(err){

document.getElementById("message").innerHTML="Something went wrong.";

console.log(err);

}

}

</script>

</body>
</html>
