<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Quantum ML Academy</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}

.container{

width:100%;
max-width:420px;
background:#fff;
padding:40px;
border-radius:15px;
box-shadow:0 20px 40px rgba(0,0,0,.25);

}

.logo{

font-size:28px;
font-weight:bold;
color:#2563eb;
text-align:center;
margin-bottom:10px;

}

.subtitle{

text-align:center;
margin-bottom:30px;
color:#666;

}

.input-group{

margin-bottom:20px;

}

label{

display:block;
margin-bottom:8px;
font-weight:bold;

}

input{

width:100%;
padding:13px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;

}

button{

width:100%;
padding:14px;
background:#2563eb;
color:#fff;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;

}

button:hover{

background:#1d4ed8;

}

#message{

margin-top:18px;
text-align:center;
font-weight:bold;

}

.signup{

margin-top:20px;
text-align:center;

}

.signup a{

text-decoration:none;
color:#2563eb;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">
Quantum ML Academy
</div>

<div class="subtitle">
Student Login
</div>

<div class="input-group">

<label>Email</label>

<input
type="email"
id="email"
placeholder="Enter Email">

</div>

<div class="input-group">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter Password">

</div>

<button onclick="loginUser()">

Login

</button>

<div id="message"></div>

<div class="signup">

Don't have an account?

<a href="/signup">

Create Account

</a>

</div>

</div>

<script>

async function loginUser(){

const email=document.getElementById("email").value.trim();

const password=document.getElementById("password").value.trim();

if(email==="" || password===""){

document.getElementById("message").style.color="red";

document.getElementById("message").innerHTML="Please fill all fields.";

return;

}

try{

const response=await fetch("/api/users/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email:email,
password:password

})

});

const result=await response.json();

if(result.success){

/*
Store complete user object
*/

localStorage.setItem(

"token",

JSON.stringify(result.user)

);

/*
Better readable object
*/

localStorage.setItem(

"user",

JSON.stringify(result.user)

);

document.getElementById("message").style.color="green";

document.getElementById("message").innerHTML=result.message;

/*
Redirect Dashboard
*/

setTimeout(()=>{

window.location="/";

},1000);

}else{

document.getElementById("message").style.color="red";

document.getElementById("message").innerHTML=result.message;

}

}catch(err){

console.log(err);

document.getElementById("message").style.color="red";

document.getElementById("message").innerHTML="Server Error.";

}

}

</script>

</body>
</html>
