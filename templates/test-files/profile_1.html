<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile | Quantum ML Academy</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#f4f7fb;

}

.container{

max-width:1200px;
margin:40px auto;
padding:20px;

}

.profile-card{

background:#fff;
border-radius:18px;
padding:40px;
box-shadow:0 10px 30px rgba(0,0,0,.08);

}

.header{

display:flex;
align-items:center;
gap:35px;
flex-wrap:wrap;

}

.avatar{

width:190px;
height:190px;
border-radius:50%;
object-fit:cover;
border:8px solid #2563eb;
box-shadow:0 10px 25px rgba(0,0,0,.15);

}

.user-info h1{

font-size:35px;
margin-bottom:10px;

}

.user-info p{

font-size:17px;
color:#666;
margin:6px 0;

}

.stats{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
margin-top:35px;

}

.stat{

background:#2563eb;
color:white;
padding:25px;
border-radius:15px;
text-align:center;

}

.stat h2{

font-size:32px;
margin-bottom:8px;

}

.section{

margin-top:35px;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 8px 20px rgba(0,0,0,.06);

}

.section h2{

margin-bottom:25px;
color:#2563eb;

}

.grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:18px;

}

.item{

padding:15px;
border:1px solid #eee;
border-radius:10px;
background:#fafafa;

}

.item strong{

display:block;
margin-bottom:6px;
color:#2563eb;

}

.list{

display:flex;
flex-wrap:wrap;
gap:10px;

}

.badge{

background:#2563eb;
color:white;
padding:8px 15px;
border-radius:30px;
font-size:14px;

}

.empty{

color:#888;

}

@media(max-width:768px){

.header{

justify-content:center;
text-align:center;

}

.avatar{

width:150px;
height:150px;

}

.user-info h1{

font-size:28px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="profile-card">

<div class="header">

<img
id="profile_image"
class="avatar"
src=""
alt="Profile">

<div class="user-info">

<h1 id="full_name">Loading...</h1>

<p id="email"></p>

<p id="phone"></p>

<p id="learning_level"></p>

</div>

</div>

<div class="stats">

<div class="stat">

<h2 id="xp">0</h2>

<p>Experience</p>

</div>

<div class="stat">

<h2 id="coins">0</h2>

<p>Coins</p>

</div>

</div>

</div>

<div class="section">

<h2>Personal Information</h2>

<div class="grid">

<div class="item">
<strong>First Name</strong>
<span id="first_name"></span>
</div>

<div class="item">
<strong>Last Name</strong>
<span id="last_name"></span>
</div>

<div class="item">
<strong>Gender</strong>
<span id="gender"></span>
</div>

<div class="item">
<strong>Date of Birth</strong>
<span id="dob"></span>
</div>

<div class="item">
<strong>Country</strong>
<span id="country"></span>
</div>

<div class="item">
<strong>State</strong>
<span id="state"></span>
</div>

<div class="item">
<strong>City</strong>
<span id="city"></span>
</div>

</div>

</div>

<div class="section">

<h2>Academic Information</h2>

<div class="grid">

<div class="item">
<strong>College</strong>
<span id="college"></span>
</div>

<div class="item">
<strong>University</strong>
<span id="university"></span>
</div>

<div class="item">
<strong>Course</strong>
<span id="course"></span>
</div>

<div class="item">
<strong>Branch</strong>
<span id="branch"></span>
</div>

<div class="item">
<strong>Semester</strong>
<span id="semester"></span>
</div>

<div class="item">
<strong>Current Course</strong>
<span id="current_course"></span>
</div>

</div>

</div>

<div class="section">

<h2>Bio</h2>

<p id="bio"></p>

</div>

<div class="section">

<h2>Achievements</h2>

<h3 style="margin-bottom:15px;">Badges</h3>

<div id="badges" class="list"></div>

<br>

<h3 style="margin-bottom:15px;">Certificates</h3>

<div id="certificates" class="list"></div>

</div>

</div>

<script>

const token=JSON.parse(localStorage.getItem("token"));

if(!token){

window.location="/login";

}

fetch("/api/profile/get",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

id:token.id,

email:token.email

})

})

.then(res=>res.json())

.then(data=>{

if(!data.success){

alert("Unable to load profile");

return;

}

const p=data.profile;

document.getElementById("profile_image").src=p.profile_image;

document.getElementById("full_name").innerHTML=p.full_name;

document.getElementById("email").innerHTML="📧 "+p.email;

document.getElementById("phone").innerHTML="📱 "+p.phone;

document.getElementById("learning_level").innerHTML="🎓 "+p.learning_level;

document.getElementById("xp").innerHTML=p.xp;

document.getElementById("coins").innerHTML=p.coins;

document.getElementById("first_name").innerHTML=p.first_name;

document.getElementById("last_name").innerHTML=p.last_name;

document.getElementById("gender").innerHTML=p.gender;

document.getElementById("dob").innerHTML=p.dob;

document.getElementById("country").innerHTML=p.country;

document.getElementById("state").innerHTML=p.state;

document.getElementById("city").innerHTML=p.city;

document.getElementById("college").innerHTML=p.college;

document.getElementById("university").innerHTML=p.university;

document.getElementById("course").innerHTML=p.course;

document.getElementById("branch").innerHTML=p.branch;

document.getElementById("semester").innerHTML=p.semester;

document.getElementById("current_course").innerHTML=p.current_course;

document.getElementById("bio").innerHTML=p.bio || "No bio added.";

const badgeContainer=document.getElementById("badges");

if(p.badges.length===0){

badgeContainer.innerHTML="<span class='empty'>No Badges Yet</span>";

}else{

p.badges.forEach(b=>{

badgeContainer.innerHTML+=`<span class="badge">${b}</span>`;

});

}

const certificateContainer=document.getElementById("certificates");

if(p.certificates.length===0){

certificateContainer.innerHTML="<span class='empty'>No Certificates Yet</span>";

}else{

p.certificates.forEach(c=>{

certificateContainer.innerHTML+=`<span class="badge">${c}</span>`;

});

}

})
.catch(err=>{

console.log(err);

alert("Server Error");

});

</script>

</body>
</html>
